name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18.20.8', '20.20.2', '22.22.3']
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  live-backend:
    name: live clavenar-lite backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: clavenar/clavenar-lite
          path: clavenar-lite

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: build live backend
        run: cargo build --locked --manifest-path clavenar-lite/Cargo.toml

      - name: prove the transitional Lite decision boundary
        env:
          CLAVENAR_E2E_ENDPOINT: http://127.0.0.1:8088
          CLAVENAR_E2E_TOKEN: feature-matrix-agent
          CLAVENAR_E2E_DECIDE_TOKEN: feature-matrix-operator
        run: |
          clavenar-lite/target/debug/clavenar-lite start \
            --port 8088 \
            --policies clavenar-lite/policies \
            --ledger :memory: \
            --upstream http://127.0.0.1:9 \
            --token "$CLAVENAR_E2E_TOKEN" \
            --decide-token "$CLAVENAR_E2E_DECIDE_TOKEN" > /tmp/clavenar-lite.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true; cat /tmp/clavenar-lite.log' EXIT
          for _ in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8088/readyz >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8088/readyz >/dev/null
          pnpm exec tsx tests/lite-decision-boundary.ts

  # Same posture as the Go/Java/.NET siblings, which all scan in the PR
  # path — this package ships to npm and had no vuln/SBOM gate here.
  supply-chain:
    name: audit + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # pnpm 11 uses npm's current bulk-advisory API. Keep the test
          # matrix on pnpm 9 so the published Node 18 floor remains covered.
          version: 11.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Runtime deps gate the build; dev-only advisories surface in the
      # log without failing it (--prod scopes the tree).
      - run: pnpm audit --prod --audit-level high

      - name: generate CycloneDX SBOM
        run: npx --yes @cyclonedx/cdxgen@12.7.1 -t js -o bom.json .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: bom.json
