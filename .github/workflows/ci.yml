name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        node: ['18.20.8', '20.20.2', '22.22.3']
    steps:
      - name: Attach retained self-hosted checkout commit
        run: |
          if git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git -C "$GITHUB_WORKSPACE" update-ref refs/clavenar/runner-retained HEAD
          fi

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.9
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.node }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  live-backend:
    name: live clavenar-lite backend
    runs-on: self-hosted
    steps:
      - name: Attach retained self-hosted checkout commit
        run: |
          if git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git -C "$GITHUB_WORKSPACE" update-ref refs/clavenar/runner-retained HEAD
          fi

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: clavenar/clavenar-lite
          path: clavenar-lite

      - name: Prepare isolated Rust state
        run: |
          state_root="$RUNNER_TEMP/typescript-sdk-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          mkdir -p "$state_root/cargo-home" "$state_root/rustup-home" "$state_root/cargo-target"
          echo "CARGO_HOME=$state_root/cargo-home" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$state_root/rustup-home" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$state_root/cargo-target" >> "$GITHUB_ENV"

      - name: Expose preinstalled rustup without modifying shell profiles
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            [ -x "$HOME/.cargo/bin/rustup" ] || { echo "::error::rustup is not preinstalled"; exit 1; }
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.9
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3

      - run: pnpm install --frozen-lockfile

      - name: build live backend
        run: cargo build --locked --manifest-path clavenar-lite/Cargo.toml

      - name: prove the Lite side-effect-free decision boundary
        env:
          CLAVENAR_E2E_ENDPOINT: http://127.0.0.1:8088
          CLAVENAR_E2E_TOKEN: feature-matrix-agent
          CLAVENAR_E2E_DECIDE_TOKEN: feature-matrix-operator
        run: |
          log_file="$RUNNER_TEMP/clavenar-lite-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.log"
          "$CARGO_TARGET_DIR/debug/clavenar-lite" start \
            --port 8088 \
            --policies clavenar-lite/policies \
            --ledger :memory: \
            --upstream http://127.0.0.1:9 \
            --token "$CLAVENAR_E2E_TOKEN" \
            --decide-token "$CLAVENAR_E2E_DECIDE_TOKEN" > "$log_file" 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true; cat "$log_file"' EXIT
          for _ in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8088/readyz >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8088/readyz >/dev/null
          pnpm exec tsx tests/lite-decision-boundary.ts

  # Same posture as the Go/Java/.NET siblings, which all scan in the PR
  # path — this package ships to npm and had no vuln/SBOM gate here.
  supply-chain:
    name: audit + SBOM
    runs-on: self-hosted
    steps:
      - name: Attach retained self-hosted checkout commit
        run: |
          if git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git -C "$GITHUB_WORKSPACE" update-ref refs/clavenar/runner-retained HEAD
          fi

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # pnpm 11 uses npm's current bulk-advisory API. Keep the test
          # matrix on pnpm 9 so the published Node 18 floor remains covered.
          version: 11.4.0
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3

      - run: pnpm install --frozen-lockfile

      # Runtime deps gate the build; dev-only advisories surface in the
      # log without failing it (--prod scopes the tree).
      - run: pnpm audit --prod --audit-level high

      - name: generate CycloneDX SBOM
        run: npx --yes @cyclonedx/cdxgen@12.7.1 -t js -o bom.json .

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sbom
          path: bom.json
